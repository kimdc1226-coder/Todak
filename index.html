<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="토닥토닥 전시 이야기 — 구술 기록 아카이브">
  <title>토닥토닥 전시 이야기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-bloom" aria-hidden="true"></div>

  <main class="page">
    <header class="archive-header">
      <p class="archive-eyebrow">Oral History Archive</p>
      <h1>토닥토닥 전시 이야기</h1>
      <p class="archive-lead">카드를 눌러 이야기를 펼쳐 읽습니다.</p>
    </header>

    <!--
      ========================================
      [데이터 수정 안내]
      할머니 이름·이야기 제목·본문은 script.js 안의
      grandmothersData 배열만 수정하면 됩니다.
      ========================================
    -->

    <section class="magazine" aria-label="할머니들의 기록 갤러리">
      <div class="magazine-track" id="magazine-track">
        <!-- 카드는 script.js에서 생성됩니다 -->
      </div>
    </section>

    <footer class="archive-footer">
      <p>토닥토닥 전시 이야기 · Oral History Archive</p>
    </footer>
  </main>

  <!-- 중앙 모달 (공통 1개) -->
  <div class="modal" id="story-modal" hidden>
    <div class="modal-backdrop" data-close-modal aria-label="닫기"></div>
    <div class="modal-book" role="dialog" aria-modal="true" aria-labelledby="modal-grandma-name">
      <button type="button" class="modal-close" data-close-modal aria-label="닫기">✕</button>

      <header class="modal-header">
        <p class="modal-record" id="modal-record-label">RECORD 01</p>
        <h2 class="modal-grandma-name" id="modal-grandma-name"></h2>
        <p class="modal-grandma-note">이야기 4편</p>
      </header>

      <div class="story-tabs" id="story-tabs" role="tablist" aria-label="이야기 목록"></div>

      <article class="story-panel">
        <h3 class="story-title" id="modal-story-title"></h3>
        <div class="story-body" id="modal-story-body"></div>
      </article>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
