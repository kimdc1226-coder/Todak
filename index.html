<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="토닥토닥, 내 인생 참 예쁘다 — 구술 기록 아카이브">
  <title>토닥토닥, 내 인생 참 예쁘다</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-photo" aria-hidden="true">
    <img class="bg-photo-image" src="bg-grandmothers.jpg" alt="">
  </div>
  <div class="bg-overlay" aria-hidden="true"></div>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <main class="page">
    <!--
      [데이터 수정 안내]
      할머니 이름·이야기 제목·본문은 script.js 의
      grandmothersData 배열만 수정하면 됩니다.
    -->

    <article class="flyer" aria-label="토닥토닥 전시 전단지">
      <div class="flyer-sheet">
        <header class="flyer-header">
          <p class="flyer-eyebrow">Exhibition: Our Life Stories</p>
          <h1>토닥토닥, 내 인생 참 예쁘다</h1>
          <p class="flyer-subtitle-en">미처 못담은 우리들의 이야기</p>
          <p class="flyer-subtitle-ko">
            <span>(기억을 품고, 이야기를 나누다)</span>
          </p>
          <p class="flyer-hint">아래 쪽지를 터치해 어르신들의 이야기를 확인해 보세요.</p>
        </header>

        <!-- 절취선 -->
        <div class="tear-line" aria-hidden="true">
          <span class="tear-line-label">✂ 살짝 뜯어보세요.</span>
        </div>

        <!-- 이름 탭 (절취선 아래) -->
        <div class="tear-tabs" id="tear-tabs" role="group" aria-label="할머니 이름 탭"></div>
      </div>
    </article>

    <footer class="archive-footer">
      <p>© Todak Todak Exhibition · Oral History Archive</p>
    </footer>
  </main>

  <!-- 겹친 메모지 모달 -->
  <div class="modal" id="story-modal" hidden>
    <div class="modal-backdrop" data-close-modal aria-label="닫기"></div>

    <div class="memo-modal" role="dialog" aria-modal="true" aria-labelledby="modal-book-tag">
      <button type="button" class="modal-close" data-close-modal aria-label="닫기">✕</button>

      <p class="memo-modal-tag" id="modal-book-tag">할머니의 이야기 🌸</p>

      <div class="memo-stack" id="memo-stack" aria-live="polite"></div>

      <button type="button" class="memo-action-btn" id="memo-action-btn">
        다음 이야기 뜯기 →
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
