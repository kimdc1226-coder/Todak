<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="토닥토닥 전시 이야기 — 구술 기록 아카이브">
  <title>토닥토닥 전시 이야기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-photo" aria-hidden="true">
    <img class="bg-photo-image" src="bg-grandmothers.jpg" alt="">
  </div>
  <div class="bg-overlay" aria-hidden="true"></div>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <main class="page">
    <!--
      [데이터 수정 안내]
      할머니 이름·이야기 제목·본문은 script.js 의
      grandmothersData 배열만 수정하면 됩니다.
    -->

    <article class="flyer" aria-label="토닥토닥 전시 전단지">
      <div class="flyer-sheet">
        <header class="flyer-header">
          <p class="flyer-eyebrow">Oral History Archive</p>
          <h1>토닥토닥 전시 이야기</h1>
          <p class="flyer-subtitle-en">Todak Todak Exhibition | Oral History Archive</p>
          <p class="flyer-subtitle-ko">
            Preserving Memories, Sharing Stories<br>
            <span>(기억을 품고, 이야기를 나누다)</span>
          </p>
          <p class="flyer-hint">아래 이름을 살짝 뜯어 이야기를 읽어 보세요</p>
        </header>

        <!-- 절취선 -->
        <div class="tear-line" aria-hidden="true">
          <span class="tear-line-label">✂ tear here</span>
        </div>

        <!-- 뜯는 종이 탭 10개 -->
        <div class="tear-tabs" id="tear-tabs" role="group" aria-label="할머니 이름 탭"></div>
      </div>
    </article>

    <footer class="archive-footer">
      <p>© Todak Todak Exhibition · Oral History Archive</p>
    </footer>
  </main>

  <!-- 동화책 모달 -->
  <div class="modal" id="story-modal" hidden>
    <div class="modal-backdrop" data-close-modal aria-label="닫기"></div>

    <div class="storybook" role="dialog" aria-modal="true" aria-labelledby="modal-book-tag">
      <button type="button" class="modal-close" data-close-modal aria-label="닫기">✕</button>

      <p class="storybook-tag" id="modal-book-tag">할머니의 동화책 🌸</p>

      <div class="storybook-frame">
        <div class="storybook-bloom storybook-bloom--tl" aria-hidden="true">🌸</div>
        <div class="storybook-bloom storybook-bloom--br" aria-hidden="true">🌸</div>
        <div class="storybook-spine" aria-hidden="true"></div>

        <div class="storybook-pages">
          <div class="story-tabs" id="story-tabs" role="tablist" aria-label="이야기 목록"></div>

          <div class="storybook-flip-stage" id="storybook-flip-stage">
            <article class="storybook-content" id="storybook-content">
              <p class="storybook-page-label" id="modal-page-label">이야기 1</p>
              <h3 class="story-title" id="modal-story-title"></h3>
              <div class="story-body" id="modal-story-body"></div>
            </article>
          </div>

          <div class="storybook-pager">
            <button type="button" class="storybook-nav" id="story-prev" aria-label="이전 이야기">← 이전</button>
            <span class="storybook-page-count" id="modal-page-count">1 / 4</span>
            <button type="button" class="storybook-nav" id="story-next" aria-label="다음 이야기">다음 →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
